<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
  <title id="title">Storage power law for Adam's laptop and external SSD</title>
  <desc id="desc">A ranked view of laptop user data, installed applications, SSD composition, and recommended next actions from the August 28, 2026 storage audit.</desc>
  <style>
    .bg { fill: #f6f8fb; }
    .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 1; }
    .ink { fill: #162033; }
    .muted { fill: #5d697c; }
    .faint { fill: #8792a5; }
    .blue { fill: #2e6be6; }
    .blue-soft { fill: #dce8ff; }
    .navy { fill: #173f7a; }
    .amber { fill: #c76d05; }
    .amber-soft { fill: #fff0d5; }
    .critical { fill: #b42318; }
    .critical-soft { fill: #fee4e2; }
    .positive { fill: #1f7a4d; }
    .positive-soft { fill: #daf2e5; }
    .slate-bar { fill: #9ba8ba; }
    .slate-soft { fill: #e8edf3; }
    .free { fill: #edf1f5; stroke: #b9c3d0; stroke-width: 1; }
    .h1 { font: 700 36px "Segoe UI", Arial, sans-serif; }
    .h2 { font: 700 21px "Segoe UI", Arial, sans-serif; }
    .h3 { font: 700 15px "Segoe UI", Arial, sans-serif; }
    .body { font: 400 15px "Segoe UI", Arial, sans-serif; }
    .small { font: 400 13px "Segoe UI", Arial, sans-serif; }
    .tiny { font: 400 12px "Segoe UI", Arial, sans-serif; }
    .mono { font: 600 15px Consolas, "Courier New", monospace; }
    .mono-big { font: 700 30px Consolas, "Courier New", monospace; }
    .rule { stroke: #d7dee8; stroke-width: 1; }
  </style>

  <rect class="bg" width="1440" height="1280"/>

  <text x="64" y="64" class="h1 ink">Storage power law</text>
  <text x="64" y="92" class="body muted">Laptop + Samsung T5, measured 28 Aug 2026, 10:28 SGT</text>
  <rect x="1154" y="42" width="222" height="44" rx="8" class="critical-soft"/>
  <text x="1174" y="69" class="h3 critical">C: CRITICAL, 0.4% FREE</text>

  <g aria-label="Drive summary">
    <rect x="64" y="120" width="308" height="118" rx="12" class="panel"/>
    <text x="88" y="152" class="h3 muted">LAPTOP C:</text>
    <text x="88" y="194" class="mono-big critical">3.77 GiB free</text>
    <text x="88" y="219" class="small muted">929.25 of 933.02 GiB used</text>

    <rect x="388" y="120" width="308" height="118" rx="12" class="panel"/>
    <text x="412" y="152" class="h3 muted">SAMSUNG T5 E:</text>
    <text x="412" y="194" class="mono-big positive">392.75 GiB free</text>
    <text x="412" y="219" class="small muted">538.75 of 931.50 GiB used</text>

    <rect x="712" y="120" width="308" height="118" rx="12" class="panel"/>
    <text x="736" y="152" class="h3 muted">CONFIRMED CLEANUP</text>
    <text x="736" y="194" class="mono-big amber">16.64 GiB</text>
    <text x="736" y="219" class="small muted">Five exact Temp folders</text>

    <rect x="1036" y="120" width="340" height="118" rx="12" class="panel"/>
    <text x="1060" y="152" class="h3 muted">LATER, DO NOT MOVE YET</text>
    <text x="1060" y="194" class="mono-big ink">133.13 GiB</text>
    <text x="1060" y="219" class="small muted">FC 26 + Overwatch via launchers</text>
  </g>

  <g aria-label="Laptop user data Pareto">
    <rect x="64" y="268" width="760" height="528" rx="12" class="panel"/>
    <text x="92" y="306" class="h2 ink">Laptop user data Pareto</text>
    <text x="92" y="330" class="small muted">Logical size within C:\Users, 673.65 GiB measured</text>
    <rect x="560" y="288" width="232" height="52" rx="8" class="amber-soft"/>
    <text x="576" y="310" class="h3 amber">TOP 4 = 81.6%</text>
    <text x="576" y="329" class="tiny muted">549.81 GiB in four folders</text>

    <text x="92" y="370" class="tiny faint">FOLDER</text>
    <text x="302" y="370" class="tiny faint">LOGICAL SIZE</text>
    <text x="736" y="370" text-anchor="end" class="tiny faint">CUMULATIVE</text>

    <text x="92" y="405" class="body ink">AppData</text>
    <rect x="302" y="388" width="420" height="20" rx="4" class="blue"/>
    <text x="310" y="403" class="tiny" fill="#ffffff">158.40 GiB</text>
    <text x="770" y="405" text-anchor="end" class="mono muted">23.5%</text>

    <text x="92" y="450" class="body ink">Desktop</text>
    <rect x="302" y="433" width="393" height="20" rx="4" class="blue"/>
    <text x="310" y="448" class="tiny" fill="#ffffff">148.12 GiB</text>
    <text x="770" y="450" text-anchor="end" class="mono muted">45.5%</text>

    <text x="92" y="495" class="body ink">Pictures</text>
    <rect x="302" y="478" width="332" height="20" rx="4" class="blue"/>
    <text x="310" y="493" class="tiny" fill="#ffffff">125.33 GiB</text>
    <text x="770" y="495" text-anchor="end" class="mono muted">64.1%</text>

    <text x="92" y="540" class="body ink">Aether</text>
    <rect x="302" y="523" width="313" height="20" rx="4" class="blue"/>
    <text x="310" y="538" class="tiny" fill="#ffffff">117.96 GiB</text>
    <text x="770" y="540" text-anchor="end" class="mono amber">81.6%</text>

    <text x="92" y="585" class="body ink">Other user data</text>
    <rect x="302" y="568" width="152" height="20" rx="4" class="slate-bar"/>
    <text x="310" y="583" class="tiny" fill="#162033">57.34 GiB</text>
    <text x="770" y="585" text-anchor="end" class="mono muted">90.1%</text>

    <text x="92" y="630" class="body ink">Videos</text>
    <rect x="302" y="613" width="126" height="20" rx="4" class="slate-bar"/>
    <text x="310" y="628" class="tiny" fill="#162033">47.47 GiB</text>
    <text x="770" y="630" text-anchor="end" class="mono muted">97.2%</text>

    <text x="92" y="675" class="body ink">Downloads</text>
    <rect x="302" y="658" width="35" height="20" rx="4" class="slate-bar"/>
    <text x="350" y="674" class="mono muted">13.02</text>
    <text x="770" y="675" text-anchor="end" class="mono muted">99.1%</text>

    <text x="92" y="720" class="body ink">Documents</text>
    <rect x="302" y="703" width="12" height="20" rx="4" class="slate-bar"/>
    <text x="327" y="719" class="mono muted">4.35</text>
    <text x="770" y="720" text-anchor="end" class="mono muted">99.7%</text>

    <text x="92" y="765" class="body ink">Music</text>
    <rect x="302" y="748" width="5" height="20" rx="2" class="slate-bar"/>
    <text x="320" y="764" class="mono muted">1.66</text>
    <text x="770" y="765" text-anchor="end" class="mono muted">100%</text>
  </g>

  <g aria-label="SSD composition">
    <rect x="848" y="268" width="528" height="528" rx="12" class="panel"/>
    <text x="876" y="306" class="h2 ink">SSD composition</text>
    <text x="876" y="330" class="small muted">Capacity 931.50 GiB, 42.2% free</text>

    <rect x="876" y="362" width="205" height="132" class="navy"/>
    <text x="892" y="390" class="h3" fill="#ffffff">Backup</text>
    <text x="892" y="418" class="mono" fill="#ffffff">412.46 GiB</text>
    <text x="892" y="474" class="tiny" fill="#dce8ff">44.3% of SSD</text>

    <rect x="1081" y="362" width="61" height="132" class="blue"/>
    <text x="1112" y="390" text-anchor="middle" class="tiny" fill="#ffffff">Videos</text>
    <text x="1112" y="413" text-anchor="middle" class="tiny" fill="#ffffff">122.15</text>

    <rect x="1142" y="362" width="3" height="132" class="amber"/>
    <rect x="1145" y="362" width="199" height="132" class="free"/>
    <text x="1244" y="410" text-anchor="middle" class="h3 muted">Free</text>
    <text x="1244" y="438" text-anchor="middle" class="mono ink">392.75 GiB</text>
    <text x="1244" y="474" text-anchor="middle" class="tiny muted">42.2% of SSD</text>

    <text x="876" y="536" class="h3 ink">Inside E:\Backup</text>
    <text x="876" y="558" class="tiny muted">Desktop + Pictures = 81.3% of backup bytes</text>

    <text x="876" y="594" class="small ink">Desktop</text>
    <rect x="1000" y="580" width="250" height="16" rx="3" class="navy"/>
    <text x="1262" y="594" class="mono muted">208.72</text>

    <text x="876" y="632" class="small ink">Pictures</text>
    <rect x="1000" y="618" width="152" height="16" rx="3" class="navy"/>
    <text x="1164" y="632" class="mono muted">126.57</text>

    <text x="876" y="670" class="small ink">Aether</text>
    <rect x="1000" y="656" width="37" height="16" rx="3" class="blue"/>
    <text x="1049" y="670" class="mono muted">31.25</text>

    <text x="876" y="708" class="small ink">Music</text>
    <rect x="1000" y="694" width="33" height="16" rx="3" class="blue"/>
    <text x="1045" y="708" class="mono muted">27.60</text>

    <text x="876" y="746" class="small ink">Compressed</text>
    <rect x="1000" y="732" width="21" height="16" rx="3" class="slate-bar"/>
    <text x="1033" y="746" class="mono muted">17.13</text>
  </g>

  <g aria-label="Installed application concentration">
    <rect x="64" y="824" width="632" height="360" rx="12" class="panel"/>
    <text x="92" y="864" class="h2 ink">Installed application concentration</text>
    <text x="92" y="888" class="small muted">Top specific folders across Program Files and ProgramData</text>
    <rect x="448" y="842" width="216" height="52" rx="8" class="blue-soft"/>
    <text x="464" y="864" class="h3 navy">TOP 2 = 152.65 GiB</text>
    <text x="464" y="883" class="tiny muted">Steam + Overwatch</text>

    <text x="92" y="934" class="body ink">Steam</text>
    <rect x="232" y="917" width="330" height="20" rx="4" class="navy"/>
    <text x="574" y="933" class="mono muted">78.14</text>

    <text x="92" y="979" class="body ink">Overwatch</text>
    <rect x="232" y="962" width="315" height="20" rx="4" class="blue"/>
    <text x="559" y="978" class="mono muted">74.50</text>

    <text x="92" y="1024" class="body ink">Unity</text>
    <rect x="232" y="1007" width="86" height="20" rx="4" class="slate-bar"/>
    <text x="330" y="1023" class="mono muted">20.42</text>

    <text x="92" y="1069" class="body ink">Hearthstone</text>
    <rect x="232" y="1052" width="51" height="20" rx="4" class="slate-bar"/>
    <text x="295" y="1068" class="mono muted">12.14</text>

    <text x="92" y="1114" class="body ink">Wizard101</text>
    <rect x="232" y="1097" width="49" height="20" rx="4" class="slate-bar"/>
    <text x="293" y="1113" class="mono muted">11.58</text>

    <text x="92" y="1156" class="tiny muted">Steam includes FC 26 at 58.62 GiB. No game was moved.</text>
  </g>

  <g aria-label="Suggested next actions">
    <rect x="720" y="824" width="656" height="360" rx="12" class="panel"/>
    <text x="748" y="864" class="h2 ink">Suggested next actions</text>
    <text x="748" y="888" class="small muted">Ordered by safety, recurrence, then potential recovery</text>

    <rect x="748" y="916" width="600" height="54" rx="8" class="amber-soft"/>
    <circle cx="774" cy="943" r="14" class="amber"/>
    <text x="774" y="948" text-anchor="middle" class="h3" fill="#ffffff">1</text>
    <text x="800" y="939" class="h3 ink">Run confirmed Temp cleanup</text>
    <text x="800" y="959" class="small muted">Expected recovery: 16.64 GiB</text>

    <rect x="748" y="982" width="600" height="62" rx="8" class="blue-soft"/>
    <circle cx="774" cy="1013" r="14" class="blue"/>
    <text x="774" y="1018" text-anchor="middle" class="h3" fill="#ffffff">2</text>
    <text x="800" y="1007" class="h3 ink">Patch three SellSniper QA teardown paths</text>
    <text x="800" y="1028" class="small muted">Wait for the active task, then prevent profile regrowth</text>

    <rect x="748" y="1056" width="600" height="54" rx="8" class="slate-soft"/>
    <circle cx="774" cy="1083" r="14" class="slate-bar"/>
    <text x="774" y="1088" text-anchor="middle" class="h3 ink">3</text>
    <text x="800" y="1079" class="h3 ink">Review launcher moves later</text>
    <text x="800" y="1099" class="small muted">FC 26 + Overwatch: 133.13 GiB, do not move yet</text>

    <rect x="748" y="1122" width="600" height="42" rx="8" class="free"/>
    <text x="766" y="1148" class="small muted">Verify first: Desktop 148.12 GiB + Videos 47.47 GiB</text>
  </g>

  <line x1="64" y1="1214" x2="1376" y2="1214" class="rule"/>
  <text x="64" y="1242" class="tiny muted">Source: live local filesystem audit. Folder values use logical file sizes. NTFS hardlinks can make Windows and application totals non-additive.</text>
  <text x="1376" y="1242" text-anchor="end" class="tiny faint">storageclean.app audit rev A</text>
</svg>
